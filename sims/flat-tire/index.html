<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Changing a Flat Tire: The Correct Sequence</title>
<meta name="viewport" content="width=1280">
<style>
html,body{margin:0;padding:0;width:1280px;height:720px;overflow:hidden;background:#0f172a;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#root{width:1280px;height:720px;overflow:hidden;position:relative}
.zone{fill:rgba(250,204,21,0);stroke:#facc15;stroke-width:3;stroke-dasharray:9 7;opacity:0;pointer-events:none}
.zl{fill:#fff;font-size:13px;font-weight:700;opacity:0;text-anchor:middle;paint-order:stroke;stroke:#0f172a;stroke-width:4px}
body.dragging .zone{opacity:.85}body.dragging .zl{opacity:1}
.zone.hot{fill:rgba(250,204,21,.28);opacity:1;stroke-width:4}
.tool{background:#1e293b;border:2px solid #334155;border-radius:14px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:grab;color:#e2e8f0;font-weight:700;font-size:14px;touch-action:none}
.tool:hover{border-color:#f59e0b;background:#273449}
.tool.dragging{opacity:.35}.tool.used{opacity:.28;filter:grayscale(1);pointer-events:none}
.ghost{position:absolute;width:110px;height:88px;pointer-events:none;z-index:60;filter:drop-shadow(0 10px 10px rgba(0,0,0,.5));transform:scale(1.2) rotate(-6deg)}
.step{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;background:#1e293b;color:#94a3b8;font-weight:700;font-size:15px}
.step b{width:28px;height:28px;border-radius:50%;background:#334155;display:grid;place-items:center;color:#fff;flex:none}
.step.done{background:#15803d;color:#fff;box-shadow:0 0 18px rgba(34,197,94,.55)}.step.done b{background:#22c55e}
.btn,#bb button{background:#fff;color:#0f172a;font-weight:800;border-radius:10px;padding:10px 16px;border:0;cursor:pointer;font-size:14px;white-space:nowrap;font-family:inherit}
.btn:hover,#bb button:hover{background:#fde68a}
</style>
<link rel="stylesheet" href="tw.css">
</head>
<body>
<div id="root">

<!-- ============ STAGE: one SVG; every moving part is animated with SMIL inside the SVG ============ -->
<svg id="stage" class="absolute left-0 top-0" width="896" height="720" viewBox="0 0 896 720" font-family="Trebuchet MS,Segoe UI,Verdana,sans-serif">
 <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient></defs>
 <g id="scene">
  <animateTransform id="shakeA" attributeName="transform" type="translate" values="0 0;-16 9;14 -10;-12 12;10 -8;-7 5;4 -3;0 0" dur=".7s" begin="indefinite"/>
  <!-- static background -->
  <rect width="896" height="720" fill="url(#sky)"/>
  <circle cx="790" cy="100" r="42" fill="#fde68a"/>
  <path d="M0 470 Q150 380 300 450 T600 430 T896 440 V520 H0Z" fill="#86c5a0"/>
  <path d="M0 500 Q200 440 420 490 T896 480 V520 H0Z" fill="#5fae82"/>
  <rect y="520" width="896" height="200" fill="#475569"/><rect y="520" width="896" height="8" fill="#334155"/>
  <g fill="#e2e8f0"><rect x="30" y="640" width="90" height="8"/><rect x="210" y="640" width="90" height="8"/><rect x="390" y="640" width="90" height="8"/><rect x="570" y="640" width="90" height="8"/><rect x="750" y="640" width="90" height="8"/></g>
  <text x="28" y="46" font-size="26" font-weight="900" fill="#0c4a6e">Roadside: flat rear tire</text>
  <text x="28" y="72" font-size="15" fill="#075985">Drag a tool from the trunk onto the right part of the car.</text>
  <ellipse cx="450" cy="524" rx="370" ry="9" fill="#0f172a" opacity=".35"/>

  <!-- car: three nested groups so lift, slide and tilt can each be animated -->
  <g id="carLift" transform="translate(0 0)"><g id="carSlide"><g id="carTilt">
   <path d="M110 430 L110 395 Q110 375 135 370 L250 360 L300 290 Q310 272 335 272 L560 272 Q585 272 600 292 L650 358 L750 368 Q790 375 790 405 L790 430 Z" fill="#dc2f3a"/>
   <path d="M300 290 L330 360 L250 360Z" fill="#b91c28" opacity=".35"/>
   <rect x="150" y="430" width="600" height="10" rx="4" fill="#1f2937"/>
   <path d="M440 300 V430" stroke="#a31622" stroke-width="3"/><rect x="455" y="385" width="40" height="8" rx="4" fill="#7f1d1d"/>
   <rect x="768" y="382" width="22" height="16" rx="5" fill="#fde047"/><rect x="110" y="382" width="14" height="16" rx="4" fill="#7f1d1d"/>
   <rect x="318" y="288" width="262" height="80" rx="8" fill="#bfe3f5"/>
   <path d="M330 296 L372 296 L350 360 L330 360Z" fill="#fff" opacity=".35"/>
   <rect x="318" y="330" width="262" height="38" fill="#334155"/><circle cx="430" cy="352" r="9" fill="#1e293b"/>
   <g id="lever"><line x1="430" y1="352" x2="486" y2="352" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/><circle cx="486" cy="352" r="7" fill="#64748b"/>
    <animateTransform id="levA" attributeName="transform" type="rotate" values="0 430 352;-46 430 352;-35 430 352;-38 430 352" keyTimes="0;.5;.8;1" dur=".45s" begin="indefinite" fill="freeze"/></g>
   <rect id="lamp" x="500" y="338" width="68" height="24" rx="5" fill="#4c1d1d">
    <animate id="lampA" attributeName="fill" from="#4c1d1d" to="#ef4444" dur=".25s" begin="indefinite" fill="freeze"/>
    <animate id="lampP" attributeName="opacity" values="1;.55;1" dur="1.2s" begin="indefinite" repeatCount="indefinite"/></rect>
   <text x="534" y="355" font-size="12" font-weight="900" text-anchor="middle" fill="#8a4a4a">BRAKE<animate id="lampT" attributeName="fill" from="#8a4a4a" to="#fff" dur=".25s" begin="indefinite" fill="freeze"/></text>
   <rect id="zWin" class="zone" x="314" y="284" width="270" height="88" rx="10"><animate attributeName="stroke-dashoffset" from="0" to="32" dur="1s" repeatCount="indefinite"/></rect>
   <text class="zl" x="449" y="266">Dashboard</text>
   <path d="M196 430 A70 70 0 0 1 324 430Z" fill="#111827"/><path d="M576 430 A70 70 0 0 1 704 430Z" fill="#111827"/>
   <g id="wFront" transform="translate(640 458)"></g>
   <g id="wFlat" transform="translate(260 458)"></g>
   <g id="wSpare" transform="translate(260 350)" opacity="0"></g>
   <circle id="zTire" class="zone" cx="260" cy="458" r="78"><animate attributeName="stroke-dashoffset" from="0" to="32" dur="1s" repeatCount="indefinite"/></circle>
   <text class="zl" x="260" y="548">Wheel</text>
  </g></g></g>

  <rect id="zJack" class="zone" x="350" y="440" width="120" height="80" rx="10"><animate attributeName="stroke-dashoffset" from="0" to="32" dur="1s" repeatCount="indefinite"/></rect>
  <text class="zl" x="410" y="548">Jack point</text>
  <g id="jack" opacity="0"><g id="jackBody"></g></g>
 </g>

 <!-- toast (SVG, fades via SMIL) -->
 <g transform="translate(24 690)" opacity="0">
  <animate id="toastA" attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="2.8s" begin="indefinite"/>
  <rect id="toastR" y="-30" height="40" rx="10" fill="#0f172a" opacity=".93"/><rect y="-30" width="5" height="40" rx="2" fill="#f59e0b"/>
  <text id="toastT" x="18" y="-4" font-size="15" font-weight="700" fill="#fff"></text>
 </g>

 <!-- banner (SVG group that slides in/out via SMIL) -->
 <g id="banner" transform="translate(20 -160)">
  <animateTransform id="banIn" attributeName="transform" type="translate" values="20 -160;20 28;20 12;20 18" keyTimes="0;.6;.8;1" dur=".5s" begin="indefinite" fill="freeze"/>
  <animateTransform id="banOut" attributeName="transform" type="translate" values="20 18;20 -160" dur=".3s" begin="indefinite" fill="freeze"/>
  <rect id="banR" width="856" height="112" rx="16" stroke-width="3" fill="#451a03" stroke="#f59e0b">
   <animate id="banP" attributeName="stroke-width" values="3;9;3" dur=".6s" begin="indefinite" repeatCount="3"/></rect>
  <foreignObject width="856" height="112"><div xmlns="http://www.w3.org/1999/xhtml" id="banC" style="display:flex;align-items:center;gap:16px;height:112px;padding:0 20px;box-sizing:border-box">
   <div id="bi" style="font-size:40px"></div><div style="flex:1"><div id="bt" style="font-weight:900;font-size:20px;letter-spacing:.04em"></div><div id="bm" style="font-size:16px;line-height:1.35;margin-top:2px"></div></div>
   <div id="bb" style="display:flex;flex-direction:column;gap:8px"></div></div></foreignObject>
 </g>
</svg>

<!-- victory overlay: pure SVG, built with animated confetti and title when needed -->
<svg id="vic" class="absolute left-0 top-0" width="1280" height="720" viewBox="0 0 1280 720" style="display:none;z-index:50" font-family="Trebuchet MS,Segoe UI,Verdana,sans-serif"></svg>

<!-- ============ TRUNK & SOP TRACKER ============ -->
<aside class="absolute top-0 right-0 flex flex-col" style="width:384px;height:720px;box-sizing:border-box;padding:18px 20px;background:#0f172a;border-left:4px solid #f59e0b">
 <h2 class="m-0 font-black text-xl text-amber-400">The trunk</h2>
 <p class="m-0 mt-1 mb-3 text-slate-400 text-sm">Having the tools isn't enough. Use them in the right order.</p>
 <div class="grid grid-cols-2 gap-3">
  <div class="tool" data-tool="brake"><svg viewBox="0 0 100 80" width="100" height="80">
   <rect x="30" y="34" width="44" height="30" rx="12" fill="#fcd9b6" stroke="#c08a5e" stroke-width="2"/>
   <rect x="31" y="16" width="9" height="28" rx="4.5" fill="#fcd9b6" stroke="#c08a5e" stroke-width="2"/><rect x="41" y="10" width="9" height="34" rx="4.5" fill="#fcd9b6" stroke="#c08a5e" stroke-width="2"/><rect x="51" y="12" width="9" height="32" rx="4.5" fill="#fcd9b6" stroke="#c08a5e" stroke-width="2"/><rect x="61" y="18" width="9" height="26" rx="4.5" fill="#fcd9b6" stroke="#c08a5e" stroke-width="2"/>
   <rect x="21" y="40" width="10" height="22" rx="5" fill="#fcd9b6" stroke="#c08a5e" stroke-width="2" transform="rotate(-30 26 50)"/>
   <circle cx="82" cy="62" r="13" fill="#ef4444"/><text x="82" y="68" font-size="17" font-weight="900" fill="#fff" text-anchor="middle">P</text></svg><span>Parking brake</span></div>
  <div class="tool" data-tool="wrench"><svg viewBox="0 0 100 80" width="100" height="80"><g transform="rotate(-20 50 40)">
   <rect x="8" y="35" width="84" height="10" rx="5" fill="#cbd5e1"/><rect x="45" y="6" width="10" height="68" rx="5" fill="#cbd5e1"/>
   <circle cx="12" cy="40" r="9" fill="#94a3b8"/><circle cx="88" cy="40" r="9" fill="#94a3b8"/><circle cx="50" cy="10" r="8" fill="#94a3b8"/><circle cx="50" cy="70" r="8" fill="#94a3b8"/>
   <circle cx="12" cy="40" r="4" fill="#1e293b"/><circle cx="88" cy="40" r="4" fill="#1e293b"/></g></svg><span>Lug wrench</span></div>
  <div class="tool" data-tool="jack"><svg viewBox="0 0 100 80" width="100" height="80">
   <polygon points="50,14 82,44 50,70 18,44" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linejoin="round"/>
   <rect x="28" y="6" width="44" height="7" rx="2" fill="#94a3b8"/><rect x="28" y="70" width="44" height="7" rx="2" fill="#94a3b8"/><line x1="18" y1="44" x2="82" y2="44" stroke="#e2e8f0" stroke-width="4"/></svg><span>Scissor jack</span></div>
  <div class="tool" data-tool="spare"><svg viewBox="0 0 100 80" width="100" height="80">
   <circle cx="50" cy="40" r="35" fill="#111827" stroke="#475569" stroke-width="2"/><circle cx="50" cy="40" r="22" fill="#e2e8f0"/><circle cx="50" cy="40" r="6" fill="#475569"/>
   <circle cx="50" cy="28" r="3" fill="#334155"/><circle cx="50" cy="52" r="3" fill="#334155"/><circle cx="38" cy="40" r="3" fill="#334155"/><circle cx="62" cy="40" r="3" fill="#334155"/></svg><span>Spare tire</span></div>
 </div>
 <h2 class="m-0 mt-5 font-black text-xl text-amber-400">Procedure tracker</h2>
 <ol id="list" class="list-none p-0 m-0 mt-2 flex flex-col gap-2"></ol>
 <button class="btn mt-auto" style="background:#334155;color:#e2e8f0" onclick="reset()">Restart simulation</button>
</aside>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],root=$('#root'),NS='http://www.w3.org/2000/svg';
const S={brake:false,nuts:false,lift:false,swap:false};
let busy=false,modal=false,drag=null,pristine='';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- SMIL helpers: create an animation element inside an SVG node and start it ---------- */
function addAnim(el,tag,a,at=0){const n=document.createElementNS(NS,tag);a={fill:'freeze',begin:'indefinite',...a};for(const k in a)n.setAttribute(k,a[k]);el.appendChild(n);n.beginElementAt(at);return n}
const clearAnims=el=>[...el.children].filter(c=>/^animate/.test(c.tagName)).forEach(c=>c.remove());
const go=(id,at=0)=>$(id).beginElementAt(at);

/* ---------- static + animated wheel art (all SVG) ---------- */
function wheel(k){
  const flat=k==='flat',spare=k==='spare',oy=flat?6:0;
  let s=flat?`<ellipse cx="0" cy="6" rx="68" ry="56" fill="#1f2937"/><path d="M-58 42 Q0 68 58 42" stroke="#0b1220" stroke-width="6" fill="none"/>
   <circle cx="0" cy="6" r="64" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="16 30" opacity="0"><animate id="blurA" attributeName="opacity" from="0" to=".85" dur=".3s" begin="indefinite" fill="freeze"/><animateTransform id="blurR" attributeName="transform" type="rotate" values="360 0 6;0 0 6" dur=".5s" begin="indefinite" repeatCount="indefinite"/></circle>`
   :`<circle r="62" fill="#111827"/><circle r="53" fill="none" stroke="#243042" stroke-width="3" stroke-dasharray="6 5"/>`;
  s+=`<g transform="translate(0 ${oy})"><g>${flat?'<animateTransform id="spinA" attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur=".25s" begin="indefinite" repeatCount="indefinite"/>':''}<circle r="40" fill="${spare?'#f1f5f9':'#9aa8b8'}" stroke="#64748b" stroke-width="2"/>`;
  for(let i=0;i<5;i++)s+=`<rect x="-5" y="-38" width="10" height="26" rx="4" fill="#64748b" transform="rotate(${i*72+18})"/>`;
  s+=`<circle cx="0" cy="-33" r="4" fill="#f43f5e"/>`;
  for(let i=0;i<4;i++){const a=(45+i*90)*Math.PI/180;
    s+=`<g transform="translate(${(24*Math.cos(a)).toFixed(1)} ${(24*Math.sin(a)).toFixed(1)})"><polygon points="9,0 4.5,7.8 -4.5,7.8 -9,0 -4.5,-7.8 4.5,-7.8" fill="#334155" stroke="#0f172a">${flat?'<animateTransform class="nutA" attributeName="transform" type="rotate" from="0" to="40" dur=".9s" begin="indefinite" fill="freeze"/><animate class="nutA" attributeName="fill" to="#94a3b8" dur=".9s" begin="indefinite" fill="freeze"/>':''}</polygon></g>`}
  s+=`<circle r="6" fill="#475569"/>`;
  if(flat)s+=`<g id="wrench" opacity="0"><rect x="-56" y="-5" width="112" height="10" rx="5" fill="#fbbf24"/><rect x="-5" y="-56" width="10" height="112" rx="5" fill="#fbbf24"/><circle cx="-56" r="9" fill="#f59e0b"/><circle cx="56" r="9" fill="#f59e0b"/><circle cy="-56" r="9" fill="#f59e0b"/><circle cy="56" r="9" fill="#f59e0b"/>
    <animate id="wrOn" attributeName="opacity" from="0" to="1" dur=".3s" begin="indefinite" fill="freeze"/><animateTransform id="wrRot" attributeName="transform" type="rotate" from="0 0 0" to="40 0 0" dur=".9s" begin="indefinite" fill="freeze"/><animate id="wrOff" attributeName="opacity" from="1" to="0" dur=".4s" begin="indefinite" fill="freeze"/></g>`;
  s+=`</g></g>`;
  if(flat)s+=`<animate id="flatOut" attributeName="opacity" from="1" to="0" dur=".6s" begin="indefinite" fill="freeze"/>`;
  if(spare)s+=`<animate id="spIn" attributeName="opacity" from="0" to="1" dur=".3s" begin="indefinite" fill="freeze"/><animateTransform id="spDrop" attributeName="transform" type="translate" values="260 340;260 468;260 450;260 458" keyTimes="0;.55;.8;1" dur=".9s" begin="indefinite" fill="freeze"/>`;
  return s;
}
$('#wFront').innerHTML=wheel('front');$('#wFlat').innerHTML=wheel('flat');$('#wSpare').innerHTML=wheel('spare');
pristine=$('#scene').innerHTML;   // snapshot used to restart every animation cleanly

/* ---------- scissor jack: SVG redrawn at its start height, then animated with SMIL ---------- */
const geo=h=>{const x=400,yb=520,hh=h/2,w=Math.sqrt(4900-hh*hh),f=n=>+n.toFixed(2);return{p:`${f(x-w)},${yb-hh} ${x},${yb-h} ${f(x+w)},${yb-hh} ${x},${yb-4}`,x1:f(x-w),x2:f(x+w),ly:yb-hh,ty:yb-h-8}};
function drawJack(h){const g=geo(h);$('#jackBody').innerHTML=`<rect x="338" y="512" width="124" height="8" rx="3" fill="#475569"/><polygon id="jp" points="${g.p}" fill="none" stroke="#f59e0b" stroke-width="9" stroke-linejoin="round"/><line id="jl" x1="${g.x1}" y1="${g.ly}" x2="${g.x2}" y2="${g.ly}" stroke="#e2e8f0" stroke-width="4"/><rect id="jt" x="364" y="${g.ty}" width="72" height="8" rx="3" fill="#64748b"/>`}
function liftCar(ys,dur,x={}){const c=$('#carLift');clearAnims(c);c.setAttribute('transform',`translate(0 ${ys[0]})`);addAnim(c,'animateTransform',{attributeName:'transform',type:'translate',values:ys.map(y=>`0 ${y}`).join(';'),dur:dur+'s',calcMode:'linear',...x})}
async function jackRun(h0,h1,dur){drawJack(h0);const N=14,hs=[...Array(N+1)].map((_,i)=>h0+(h1-h0)*i/N),v=fn=>hs.map(fn).join(';'),o={dur:dur+'s',calcMode:'linear'};
  addAnim($('#jp'),'animate',{attributeName:'points',values:v(h=>geo(h).p),...o});
  [['#jl','x1','x1'],['#jl','x2','x2'],['#jl','y1','ly'],['#jl','y2','ly'],['#jt','y','ty']].forEach(([e,a,k])=>addAnim($(e),'animate',{attributeName:a,values:v(h=>geo(h)[k]),...o}));
  liftCar(hs.map(h=>-Math.max(0,h-72)),dur);   // chassis touches the jack at h=72, then rises with it
  await sleep(dur*1000+60)}
const jackShow=()=>{const j=$('#jack');clearAnims(j);addAnim(j,'animate',{attributeName:'opacity',from:0,to:1,dur:'.3s'})};
const jackHide=()=>addAnim($('#jack'),'animate',{attributeName:'opacity',from:1,to:0,dur:'.4s'});

/* ---------- UI ---------- */
const steps=[['brake','Set the parking brake'],['nuts','Loosen the lug nuts'],['lift','Jack up the car'],['swap','Install the spare tire']];
const render=()=>$('#list').innerHTML=steps.map(([k,t],i)=>`<li class="step ${S[k]?'done':''}"><b>${S[k]?'✓':i+1}</b><span>${t}</span></li>`).join('');
function toast(m){const t=$('#toastT');t.textContent=m;$('#toastR').setAttribute('width',t.getComputedTextLength()+32);go('#toastA')}
function banner(type,title,msg,btns){modal=true;const d=type==='danger'?['#7f1d1d','#ef4444','#fee2e2']:['#451a03','#f59e0b','#fef3c7'];
  $('#banR').setAttribute('fill',d[0]);$('#banR').setAttribute('stroke',d[1]);$('#banC').style.color=d[2];
  $('#bi').textContent=type==='danger'?'💥':'⚠';$('#bt').textContent=title;$('#bm').textContent=msg;const bb=$('#bb');bb.innerHTML='';
  btns.forEach(([l,f])=>{const e=document.createElement('button');e.textContent=l;e.onclick=()=>{hideBanner();f&&f()};bb.appendChild(e)});
  go('#banIn');if(type==='danger')go('#banP')}
function hideBanner(){if(modal){modal=false;go('#banOut')}}
const useTool=t=>$(`.tool[data-tool=${t}]`).classList.add('used');

function victory(){const r=Math.random;let s=`<rect width="1280" height="720" fill="#020617" opacity="0"><animate attributeName="opacity" from="0" to=".82" dur=".5s" fill="freeze"/></rect>`;
  for(let i=0;i<60;i++){const x=r()*1280,d=2+r()*3,b=`${-r()*d}s`;s+=`<rect width="10" height="16" fill="hsl(${r()*360|0},85%,60%)"><animateTransform attributeName="transform" type="translate" from="${x|0} -30" to="${(x+r()*80-40)|0} 750" dur="${d}s" begin="${b}" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="720" dur="${d}s" begin="${b}" repeatCount="indefinite"/></rect>`}
  s+=`<g transform="translate(640 290)"><g><animateTransform attributeName="transform" type="scale" values="0.2;1.12;1" keyTimes="0;.7;1" dur=".7s" fill="freeze"/>
   <text y="-14" font-size="62" font-weight="900" text-anchor="middle" fill="#4ade80" stroke="#14532d" stroke-width="7" paint-order="stroke">TIRE CHANGED SAFELY —</text>
   <text y="62" font-size="62" font-weight="900" text-anchor="middle" fill="#4ade80" stroke="#14532d" stroke-width="7" paint-order="stroke">READY TO DRIVE!</text></g></g>
   <text x="640" y="440" font-size="20" text-anchor="middle" fill="#cbd5e1">Brake for stability, loosen on the ground for friction, lift for clearance, then swap.</text>
   <g style="cursor:pointer" onclick="reset()"><rect x="530" y="480" width="220" height="62" rx="14" fill="#4ade80"/><text x="640" y="521" font-size="22" font-weight="800" text-anchor="middle" fill="#0f172a">Restart</text></g>`;
  $('#vic').innerHTML=s;$('#vic').style.display='block'}

/* ---------- the four actions (each starts SMIL timelines inside the SVG) ---------- */
async function doBrake(){busy=true;go('#levA');await sleep(450);go('#lampA');go('#lampT');go('#lampP');S.brake=true;useTool('brake');render();toast('Click! Parking brake set. The BRAKE light is on.');busy=false}
async function doWrench(){busy=true;go('#wrOn');go('#wrRot',.35);$$('.nutA').forEach(n=>n.beginElementAt(.35));go('#wrOff',1.35);await sleep(1800);S.nuts=true;useTool('wrench');render();toast('Nuts cracked loose. The ground held the tire still.');busy=false}
async function doSpin(){busy=true;go('#wrOn');go('#spinA');go('#blurA');go('#blurR');await sleep(1800);
  banner('warn','PHYSICS ERROR',"The wheel is in the air! You need the ground's friction to keep the tire still while breaking the tight nuts loose.",[['Lower the car and retry',lower]]);busy=false}
async function lower(){busy=true;$('#wFlat').innerHTML=wheel('flat');await jackRun(112,26,1.5);jackHide();S.lift=false;$('.tool[data-tool=jack]').classList.remove('used');render();busy=false}
async function doJack(){busy=true;drawJack(26);jackShow();await jackRun(26,112,2.6);S.lift=true;useTool('jack');render();toast('Car raised. The wheel is clear of the ground.');busy=false}
async function fatal(){busy=true;drawJack(26);jackShow();await jackRun(26,90,1.2);await sleep(250);
  const sp={dur:'.7s',calcMode:'spline',keyTimes:'0;1',keySplines:'.5 0 1 1'};
  addAnim($('#jack'),'animateTransform',{attributeName:'transform',type:'rotate',values:'0 400 520;72 400 520',...sp});          // jack topples forward
  addAnim($('#carSlide'),'animateTransform',{attributeName:'transform',type:'translate',values:'0 0;100 0',...sp});           // car rolls forward
  addAnim($('#carTilt'),'animateTransform',{attributeName:'transform',type:'rotate',values:'0 450 520;2.2 450 520',...sp});
  await sleep(760);liftCar([-18,0],.32,{keyTimes:'0;1',calcMode:'spline',keySplines:'.5 0 1 1'});await sleep(330);   // car drops
  go('#shakeA');await sleep(900);
  banner('danger','CRITICAL DANGER','Car rolled off the jack! Always set the parking brake first.',[['Reset simulation',reset]]);busy=false}
async function doSpare(){busy=true;go('#flatOut');await sleep(600);go('#spIn');go('#spDrop');await sleep(1000);S.swap=true;useTool('spare');render();await sleep(300);
  await jackRun(112,26,1.4);jackHide();await sleep(500);victory();busy=false}

/* ---------- rules engine ---------- */
const target={brake:'zWin',wrench:'zTire',jack:'zJack',spare:'zTire'};
const hint={brake:'The parking brake works from the dashboard.',wrench:'The wrench goes on the wheel nuts.',jack:'The jack goes under the car at the jack point.',spare:'The spare tire goes on the wheel hub.'};
function drop(tool,zone){
  if(zone!==target[tool]){toast("That doesn't fit there. "+hint[tool]);return}
  if(tool==='brake'){S.brake?toast('The brake is already set.'):doBrake()}
  else if(tool==='wrench'){S.nuts?toast('The nuts are already loose.'):S.lift?doSpin():doWrench()}
  else if(tool==='jack'){S.lift?toast('The car is already lifted.'):S.brake?doJack():fatal()}
  else{if(!S.lift)banner('warn','ERROR','Not enough clearance! The car must be lifted to remove the flat.',[['Got it']]);
    else if(!S.nuts)banner('warn','ERROR','The lug nuts are still tight, so the flat will not come off.',[['Got it']]);
    else doSpare()}
}

/* ---------- drag & drop (pointer events, scale-safe for Storyline) ---------- */
const zoneAt=(x,y)=>{const z=$$('.zone').find(e=>{const r=e.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom});return z?z.id:null};
function place(e){const r=root.getBoundingClientRect(),s=r.width/1280;drag.g.style.left=((e.clientX-r.left)/s-55)+'px';drag.g.style.top=((e.clientY-r.top)/s-44)+'px';const z=zoneAt(e.clientX,e.clientY);$$('.zone').forEach(el=>el.classList.toggle('hot',el.id===z))}
$$('.tool').forEach(el=>el.addEventListener('pointerdown',e=>{
  if(busy||modal||el.classList.contains('used'))return;e.preventDefault();
  const g=el.querySelector('svg').cloneNode(true);g.classList.add('ghost');root.appendChild(g);
  drag={el,g,id:el.dataset.tool};el.classList.add('dragging');document.body.classList.add('dragging');place(e)}));
addEventListener('pointermove',e=>{if(drag)place(e)});
function end(e){if(!drag)return;const{el,g,id}=drag;drag=null;g.remove();el.classList.remove('dragging');document.body.classList.remove('dragging');$$('.zone').forEach(z=>z.classList.remove('hot'));
  if(e.type==='pointercancel')return;const z=zoneAt(e.clientX,e.clientY);z?drop(id,z):toast('Drag the tool onto the car. '+hint[id])}
addEventListener('pointerup',end);addEventListener('pointercancel',end);

/* ---------- reset: restoring the SVG snapshot restarts every animation from zero ---------- */
function reset(){
  Object.keys(S).forEach(k=>S[k]=false);$('#scene').innerHTML=pristine;hideBanner();
  $('#vic').style.display='none';$('#vic').innerHTML='';$$('.tool').forEach(t=>t.classList.remove('used','dragging'));busy=false;render();
}
render();
</script>
</body>
</html>
