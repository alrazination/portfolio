<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314082B'/%3E%3Crect x='7' y='8' width='18' height='16' rx='5' fill='%23C6FF3D'/%3E%3Ccircle cx='22' cy='9' r='5' fill='%23FF4F6D'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { font-size: 1rem; }
  .a-wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px 120px; }
  .a-top { position: sticky; top: 0; z-index: 10; background: var(--night); border-bottom: 2px solid var(--panel); }
  .a-top .a-wrap { display: flex; align-items: center; gap: 14px; padding-top: 14px; padding-bottom: 14px; flex-wrap: wrap; }
  .a-top .brand { margin-right: auto; }
  .a-status { color: var(--muted); font-size: 0.92rem; }
  .a-status.is-dirty { color: var(--hot); font-weight: 700; }
  .a-status.is-ok { color: var(--lime); font-weight: 700; }
  .a-tabs { display: flex; gap: 8px; margin: 28px 0 24px; flex-wrap: wrap; }
  .a-tab { font: 700 0.98rem var(--body); background: var(--panel); color: var(--muted); border: 0; border-radius: 12px; padding: 11px 16px; cursor: pointer; }
  .a-tab[aria-selected=true] { background: var(--lime); color: var(--night); }
  h1.a-h { font-size: 1.6rem; margin: 36px 0 6px; }
  h2.a-h { font-size: 1.25rem; margin: 34px 0 12px; }
  .a-help { color: var(--muted); margin: 0 0 16px; max-width: 46rem; }
  .card { background: var(--panel); border-radius: 18px; padding: 18px 20px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .row .grow { flex: 1; min-width: 160px; }
  .thumb { width: 112px; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; background: var(--deep); }
  .card h3 { font-family: var(--body); font-size: 1.08rem; letter-spacing: 0; margin: 0; }
  .card small { color: var(--muted); }
  .field { display: grid; gap: 5px; font-weight: 700; font-size: 0.9rem; margin-bottom: 12px; }
  .field small { font-weight: 500; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 16px; }
  @media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
  input[type=text], input[type=url], input[type=email], input[type=password], input:not([type]), textarea, select {
    width: 100%; font: 500 0.98rem/1.4 var(--body); color: var(--cream); background: var(--deep);
    border: 2px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--sky); }
  textarea { resize: vertical; min-height: 70px; }
  input[type=file] { font: 500 0.92rem var(--body); color: var(--muted); }
  .sw { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; user-select: none; }
  .sw input { appearance: none; width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
  .sw input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--cream); transition: left .15s; }
  .sw input:checked { background: var(--lime); }
  .sw input:checked::after { left: 21px; background: var(--night); }
  .ib { font: 700 0.88rem var(--body); background: var(--deep); color: var(--cream); border: 2px solid var(--line); border-radius: 10px; padding: 7px 11px; cursor: pointer; }
  .ib:hover { border-color: var(--sky); }
  .ib:disabled { opacity: .35; cursor: default; }
  .ib--danger { color: var(--hot); }
  .badge { display: inline-block; font-size: 0.74rem; font-weight: 800; padding: 3px 8px; border-radius: 8px; background: var(--hot); color: var(--night); vertical-align: middle; }
  .badge--sky { background: var(--sky); }
  .edit { margin-top: 16px; padding-top: 16px; border-top: 2px solid var(--line); }
  .login { max-width: 520px; margin: 9vh auto; background: var(--panel); border-radius: 24px; padding: 32px; }
  .login h1 { font-size: 1.6rem; margin-bottom: 10px; }
  .login ol { color: var(--muted); padding-left: 1.2em; font-size: 0.95rem; }
  .login li { margin-bottom: 6px; }
  .msg { padding: 12px 14px; border-radius: 12px; background: var(--deep); margin: 12px 0; font-weight: 600; }
  .msg--err { border-left: 4px solid var(--hot); }
  .msg--ok { border-left: 4px solid var(--lime); }
  details.more summary { cursor: pointer; font-weight: 700; color: var(--sky); margin-bottom: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="admin.js"></script>
</body>
</html>
